<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mplanet Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:16px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;background:#222;color:#fff;border:1px solid #444;box-sizing:border-box}button{padding:12px 16px;border:none;border-radius:10px;background:#e50914;color:#fff;font-weight:bold;width:100%;margin:6px 0}.card{background:#1c1c1c;padding:14px;border-radius:12px;margin:8px 0}.tabs{display:flex;gap:8px} .tabs button{background:#333}.tabs button.active{background:#e50914}.hidden{display:none}small{color:#aaa}</style>
</head><body>
<div id="login">
<h2>🔐 Mplanet Admin</h2>
<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
<button onclick="login()">Login as Admin</button><p id="msg"></p>
</div>

<div id="panel" class="hidden">
<h2>Admin Panel <small>REAL DATA - Supabase</small></h2>
<div class="tabs"><button onclick="show('dash',this)" class="active">Dashboard</button><button onclick="show('users',this)">Users</button><button onclick="show('videos',this)">Videos</button><button onclick="show('with',this)">Withdraws</button></div>
<button onclick="loadAll()" style="background:#333">🔄 Refresh</button>

<div id="dash">
<div class="card"><h3 id="cUsers">Users: ...</h3><h3 id="cVideos">Videos: ...</h3><h3 id="cWith">Withdraws: ...</h3></div>
<div class="card"><h3>Add Video</h3>
<input id="vTitle" placeholder="Video Title"><input id="vUrl" placeholder="Video URL (YouTube / MP4 link)"><input id="vCoins" type="number" value="10" placeholder="Coins">
<button onclick="addVideo()">+ Add Video</button></div>
</div>

<div id="users" class="hidden"></div>
<div id="videos" class="hidden"></div>
<div id="with" class="hidden"></div>
<button onclick="logout()" style="background:#333">Logout</button>
</div>

<script>
const SUPA_URL='https://leqcrtwocznlkkfveqz.supabase.co';
const SUPA_KEY='sb_publishable_b1SFZR3ADng4sue_N5ApQA_J3s03UvE';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
const ADMIN_USER='brian';
const ADMIN_PASS_HASH='d370fee7e394e306c31ee3ac8e0cc32c420fed91179435d26bdc9efd0c8fb34f';

async function login(){
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  if(u!==ADMIN_USER){document.getElementById('msg').textContent='Wrong username';return;}
  const d=new TextEncoder().encode(p);
  const h=await crypto.subtle.digest('SHA-256',d);
  const hash=Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash!==ADMIN_PASS_HASH){document.getElementById('msg').textContent='Wrong password';return;}
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  loadAll();
}
function logout(){location.reload();}
function show(id,btn){
  document.querySelectorAll('#dash,#users,#videos,#with').forEach(e=>e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
async function loadAll(){
  const {data:users}=await supa.from('users').select('*').order('created_at',{ascending:false});
  const {data:videos}=await supa.from('videos').select('*').order('created_at',{ascending:false});
  const {data:withs}=await supa.from('withdraws').select('*').order('created_at',{ascending:false});
  document.getElementById('cUsers').textContent='Users: '+(users?.length||0);
  document.getElementById('cVideos').textContent='Videos: '+(videos?.length||0);
  document.getElementById('cWith').textContent='Withdraws: '+(withs?.length||0);
  document.getElementById('users').innerHTML='<h3>Users</h3>'+(users||[]).map(x=>`<div class="card"><b>${x.username||'No name'}</b><br>Phone: ${x.phone||'-'}<br>Balance: ${x.balance||0} coins<br><button onclick="delUser('${x.id}')" style="background:#333">Delete</button></div>`).join('')||'No users yet';
  document.getElementById('videos').innerHTML='<h3>Videos</h3>'+(videos||[]).map(x=>`<div class="card"><b>${x.title}</b><br>${x.video_url}<br>Coins: ${x.coins}<br><button onclick="delVideo('${x.id}')" style="background:#333">Delete</button></div>`).join('')||'No videos yet';
  document.getElementById('with').innerHTML='<h3>Withdraws</h3>'+(withs||[]).map(x=>`<div class="card"><b>${x.username}</b> - ${x.amount} coins<br>Phone: ${x.phone}<br>Status: ${x.status}<br>${x.status==='pending'?`<button onclick="approveWith('${x.id}')">Approve</button><button onclick="rejectWith('${x.id}')" style="background:#333">Reject</button>`:''}</div>`).join('')||'No withdraws yet';
}
async function addVideo(){
  const title=document.getElementById('vTitle').value;
  const url=document.getElementById('vUrl').value;
  const coins=parseInt(document.getElementById('vCoins').value)||10;
  if(!title||!url) return alert('Fill title + URL');
  const {error}=await supa.from('videos').insert([{title,video_url:url,coins}]);
  if(error) alert(error.message); else {alert('Video added!'); loadAll();}
}
async function delVideo(id){ if(confirm('Delete video?')){ await supa.from('videos').delete().eq('id',id); loadAll(); } }
async function delUser(id){ if(confirm('Delete user?')){ await supa.from('users').delete().eq('id',id); loadAll(); } }
async function approveWith(id){ await supa.from('withdraws').update({status:'approved'}).eq('id',id); loadAll(); }
async function rejectWith(id){ await supa.from('withdraws').update({status:'rejected'}).eq('id',id); loadAll(); }
</script></body></html>
