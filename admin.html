<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:10px}input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;box-sizing:border-box}button{background:#ffcc00;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;margin:5px 0}.card{background:#222;padding:10px;border-radius:10px;margin:10px 0}.card img{width:100%;border-radius:8px}</style></head>
<body><h2>Admin Panel</h2>
<input id="title" placeholder="Video Title">
<input id="url" placeholder="Paste YouTube Link - https://youtu.be/...">
<input id="reward" type="number" placeholder="Reward" value="100">
<button onclick="addVideo()">+ Add Video (YouTube)</button>
<p id="msg"></p>
<h3>Videos (<span id="count">0</span>)</h3><div id="list">Loading...</div>
<h3>Withdraw Requests</h3><div id="wd">Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://leqcrtwoczcnlkkfveqz.supabase.co";
const SUPABASE_KEY="sb_publishable_b1SFZR3ADng4sue_N5ApQA_J3s03UvE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function addVideo(){
  let t=document.getElementById('title').value, u=document.getElementById('url').value, r=parseInt(document.getElementById('reward').value)||100;
  if(!t||!u) return alert('Enter title + YouTube link');
  const {error}=await sb.from('Videos').insert([{title:t,video_url:u,reward:r}]);
  if(error) return alert(error.message);
  document.getElementById('msg').innerText='Video added!'; document.getElementById('title').value=''; document.getElementById('url').value='';
  loadAll();
}
function ytThumb(u){ try{ let id=u.includes('youtu.be')?u.split('youtu.be/')[1].split('?')[0]:new URL(u).searchParams.get('v'); return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }catch(e){ return ''; } }
async function loadAll(){
  let {data}=await sb.from('Videos').select('*').order('created_at',{ascending:false}).limit(20);
  document.getElementById('count').innerText=data?data.length:0;
  document.getElementById('list').innerHTML=(data||[]).map(v=>`<div class="card"><b>${v.title}</b><br><img src="${ytThumb(v.video_url)}"><p>Reward: ${v.reward} | ${v.video_url}</p><button onclick="delVideo(${v.id})" style="background:#ff4444;color:#fff">Delete</button></div>`).join('')||'No videos';
  let {data:w}=await sb.from('Withdraws').select('*').order('created_at',{ascending:false}).limit(20);
  document.getElementById('wd').innerHTML=(w||[]).map(x=>`<div class="card">${x.phone} - ${x.amount} UGX - <b>${x.status}</b><br><button onclick="approve(${x.id})">Approve</button></div>`).join('')||'No withdraws';
}
async function delVideo(id){ if(confirm('Delete?')){ await sb.from('Videos').delete().eq('id',id); loadAll(); } }
async function approve(id){ await sb.from('Withdraws').update({status:'paid'}).eq('id',id); loadAll(); }
loadAll();
</script></body></html>
