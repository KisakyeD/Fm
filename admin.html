<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mplanet Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen max-w-[600px] mx-auto">
<div class="flex justify-between items-center px-4 py-4 border-b border-blue-500/20 sticky top-0 bg-slate-950 z-10">
<div class="font-black text-2xl"><span class="text-blue-500">M</span><span class="text-orange-500">planet</span> <span class="text-sm text-red-400">ADMIN</span></div>
<a href="index.html" class="text-orange-400 font-semibold text-sm">← Back to App</a>
</div>

<div class="p-4">
<div class="grid grid-cols-3 gap-2 mb-4">
<div class="bg-slate-900 rounded-xl p-3 text-center border border-blue-500/20"><b id="stat-total" class="text-xl">0</b><br><span class="text-xs text-slate-400">Videos</span></div>
<div class="bg-slate-900 rounded-xl p-3 text-center border border-blue-500/20"><b id="stat-likes" class="text-xl text-orange-400">0</b><br><span class="text-xs text-slate-400">Total Likes</span></div>
<div class="bg-slate-900 rounded-xl p-3 text-center border border-blue-500/20"><b id="stat-rewards" class="text-xl text-amber-400">0</b><br><span class="text-xs text-slate-400">Total Rewards</span></div>
</div>

<input id="admin-search" oninput="filterAdmin(this.value)" placeholder="Search @username, caption..." class="w-full bg-slate-800 rounded-full px-4 py-2.5 outline-none mb-4">

<div id="admin-list" class="space-y-4"><p class="text-slate-400 text-sm text-center py-10">Loading videos...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient("https://leqcrtwoczcnlkkfveqz.supabase.co","sb_publishable_b1SFZR3ADng4sue_N5ApQA_J3s03UvE");
let all = [];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAdmin(){
  let {data, error} = await sb.from('Videos').select('*').order('created_at',{ascending:false}).limit(50);
  if(error){ document.getElementById('admin-list').innerHTML = '<p class="text-red-400">Error: '+error.message+'</p>'; return; }
  all = data || [];
  document.getElementById('stat-total').textContent = all.length;
  document.getElementById('stat-likes').textContent = all.reduce((s,v)=>s+(v.likes_count||0),0);
  document.getElementById('stat-rewards').textContent = all.reduce((s,v)=>s+((v.reward ?? v.coins ?? 0)),0);
  renderAdmin(all);
}
function renderAdmin(list){
  let box = document.getElementById('admin-list');
  if(!list.length){ box.innerHTML = '<p class="text-slate-400 text-center">No videos yet</p>'; return; }
  box.innerHTML = list.map(v=>{
    let reward = v.reward ?? v.coins ?? 0;
    let isYT = v.video_url && (v.video_url.includes('youtube')||v.video_url.includes('youtu.be'));
    let media = isYT ? `<p class="text-xs text-sky-300 break-all">YouTube: ${esc(v.video_url)}</p>` : `<video src="${v.video_url}" controls preload="metadata" class="w-full h-48 object-cover rounded-xl bg-black"></video>`;
    return `<div class="bg-slate-900 border border-blue-500/20 rounded-2xl p-3">
      ${media}
      <p class="font-bold mt-2">@${esc(v.username||'user')}</p>
      <p class="text-sm text-slate-300">${esc(v.caption||'')}</p>
      <p class="text-xs text-slate-400 mt-1">${new Date(v.created_at).toLocaleString()}</p>
      <p class="text-sm mt-1">❤️ ${v.likes_count||0} | 💬 ${v.comments_count||0} | <b class="text-amber-400">Reward: ${reward} coins</b></p><button onclick="loadCommentsAdmin('${v.id}')" class="mt-2 text-xs bg-sky-600 px-3 py-1.5 rounded-lg font-bold">💬 View Comments (${v.comments_count||0})</button>
<div id="comments-${v.id}" class="mt-2 space-y-2"></div>
      <div class="flex gap-2 mt-3">
        <input id="reward-${v.id}" type="number" placeholder="Set reward coins" value="${reward}" class="flex-1 bg-slate-800 rounded-lg px-3 py-2 outline-none text-sm">
        <button onclick="saveReward('${v.id}')" class="bg-amber-500 text-black px-3 py-2 rounded-lg text-sm font-bold">Save Reward</button>
        <button onclick="deleteVideo('${v.id}')" class="bg-red-500 px-3 py-2 rounded-lg text-sm font-bold">Delete</button>
      </div>
    </div>`;
  }).join('');
}
function filterAdmin(q){
  let f = all.filter(v=> (v.username||'').toLowerCase().includes(q.toLowerCase()) || (v.caption||'').toLowerCase().includes(q.toLowerCase()));
  renderAdmin(f);
}
async function saveReward(id){
  let val = parseInt(document.getElementById('reward-'+id).value) || 0;
  let {error} = await sb.from('Videos').update({reward: val}).eq('id', id);
  if(error) return alert('Error: '+error.message+'\n\nRun in Supabase SQL: ALTER TABLE "Videos" ADD COLUMN IF NOT EXISTS reward int default 0;');
  alert('Reward saved: '+val+' coins'); loadAdmin();
}
async function loadCommentsAdmin(vid){
  let box = document.getElementById('comments-'+vid);
  box.innerHTML = '<p class="text-xs text-slate-400">Loading...</p>';
  let {data, error} = await sb.from('Comments').select('*').eq('video_id', vid).order('created_at',{ascending:true});
  if(error){ box.innerHTML = '<p class="text-xs text-red-400">'+error.message+'</p>'; return; }
  if(!data || !data.length){ box.innerHTML = '<p class="text-xs text-slate-400">No comments yet</p>'; return; }
  box.innerHTML = data.map(c=>{
    let isReply = c.parent_id ? '<span class="text-orange-400 text-[10px]">↩ REPLY</span> ' : '';
    return `<div class="bg-slate-800 p-2 rounded-lg text-sm flex justify-between gap-2">
      <span>${isReply}<b class="text-sky-400">@${esc(c.username||'user')}</b>: ${esc(c.comment_text)}</span>
      <button onclick="deleteCommentAdmin('${c.id}','${vid}')" class="text-red-400 text-xs font-bold shrink-0">Delete</button>
    </div>`;
  }).join('');
}
async function deleteCommentAdmin(cid, vid){
  if(!confirm('Delete this comment?')) return;
  let {error} = await sb.from('Comments').delete().eq('id', cid);
  if(error) return alert(error.message);
  loadCommentsAdmin(vid); loadAdmin();
}async function deleteVideo(id){
  if(!confirm('Delete this video?')) return;
  let {error} = await sb.from('Videos').delete().eq('id', id);
  if(error) return alert(error.message);
  alert('Deleted'); loadAdmin();
}
loadAdmin();
</script>
</body>
</html>
